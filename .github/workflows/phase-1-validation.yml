name: Phase 1 - GitFlow Setup Validation 🧃

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-phase-1:
    runs-on: ubuntu-latest
    name: Validate Phase 1 Setup ✅

    steps:
      # Step 1: Checkout code
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get full history for tag checks

      # Step 2: Verify branches exist
      - name: 🔍 Check Required Branches
        run: |
          echo "Checking for main branch..."
          git show-ref --verify refs/heads/main && echo "✓ main branch exists" || exit 1
          
          echo "Checking for develop branch..."
          git show-ref --verify refs/heads/develop && echo "✓ develop branch exists" || exit 1

      # Step 3: Verify v1.0.0 tag
      - name: 🏷️ Check Release Tag
        run: |
          echo "Checking for v1.0.0 tag..."
          git show-ref --verify refs/tags/v1.0.0 && echo "✓ v1.0.0 tag exists" || exit 1

      # Step 4: Verify core files exist
      - name: 📁 Verify Phase 1 Files
        run: |
          echo "Checking Phase 1 required files..."
          
          [ -f "README.md" ] && echo "✓ README.md exists" || exit 1
          [ -f "docs/SIMPLIFIED.md" ] && echo "✓ docs/SIMPLIFIED.md exists" || exit 1
          [ -f "app/app_core.txt" ] && echo "✓ app/app_core.txt exists" || exit 1
          [ -f "config/config_production.txt" ] && echo "✓ config/config_production.txt exists" || exit 1

      # Step 5: Display git log
      - name: 📊 Display Git History
        run: |
          echo "Git History with Branches and Tags:"
          git log --graph --oneline --all --decorate
          
      # Step 6: Confirm Phase 1 status
      - name: ✅ Phase 1 Status
        run: |
          echo "================================"
          echo "✓ PHASE 1 VALIDATION SUCCESSFUL"
          echo "================================"
          echo "Branches:"
          git branch -a
          echo ""
          echo "Tags:"
          git tag -l
          echo ""
          echo "✓ Ready for Phase 2 - Feature Development"
